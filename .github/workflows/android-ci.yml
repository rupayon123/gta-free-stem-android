name: Android CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  # Preserve truthful green/red results when two release commits arrive close together.
  # GitHub may queue the newer run, but it will not turn the active run into a cancellation.
  cancel-in-progress: false

jobs:
  verify-debug:
    name: Tests, lint, debug build, and unsigned release bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Verify Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Verify release configuration
        run: ./scripts/verify-release-config.sh

      - name: Run tests, lint, debug assembly, and unsigned release bundle
        run: ./gradlew --no-daemon --stacktrace clean testDebugUnitTest lintDebug assembleDebug lintRelease bundleRelease

# CI builds an unsigned release AAB as compile and lint evidence only. Signing
# and upload remain excluded and require a separately reviewed, secret-gated process.
