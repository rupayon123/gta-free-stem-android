name: Android CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-debug:
    name: Tests, lint, debug build, and unsigned release bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Verify Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Verify release configuration
        run: ./scripts/verify-release-config.sh

      - name: Run tests, lint, debug assembly, and unsigned release bundle
        run: ./gradlew --no-daemon --stacktrace clean testDebugUnitTest lintDebug assembleDebug lintRelease bundleRelease

# CI builds an unsigned release AAB as compile and lint evidence only. Signing
# and upload remain excluded and require a separately reviewed, secret-gated process.
